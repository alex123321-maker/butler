name: Credential vault acceptance
on:
  pull_request:
    paths: ['.github/workflows/credentials.yml', 'internal/**', 'apps/orchestrator/**', 'apps/tool-broker/**', 'apps/tool-browser/**', 'configs/tools.json', 'migrations/**', 'scripts/dev/credential-vault-tests.sh', 'scripts/dev/browser-owner-safety-tests.sh', 'web/**', 'go.mod', 'go.sum']
  push:
    branches: [main]
    paths: ['.github/workflows/credentials.yml', 'internal/**', 'apps/orchestrator/**', 'apps/tool-broker/**', 'apps/tool-browser/**', 'configs/tools.json', 'migrations/**', 'scripts/dev/credential-vault-tests.sh', 'scripts/dev/browser-owner-safety-tests.sh', 'web/**', 'go.mod', 'go.sum']
permissions:
  contents: read
jobs:
  vault-postgres-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: credential_vault_ci_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build-linux
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
      BUTLER_TEST_VAULT_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/credential_vault_ci_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.2', cache: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix apps/tool-browser --no-audit --no-fund
      - run: cd apps/tool-browser && npx playwright install --with-deps chromium
      - run: bash scripts/dev/credential-vault-tests.sh
      - run: npm ci --prefix web --no-audit --no-fund
      # Web and tool-browser pin independent Playwright revisions.
      - run: cd web && npx playwright install --with-deps chromium
      - run: BUTLER_TEST_MEMORY_POSTGRES_URL="$BUTLER_TEST_VAULT_POSTGRES_URL" bash scripts/dev/browser-owner-safety-tests.sh
        env:
          BUTLER_BROWSER_E2E_BINARY: ${{ github.workspace }}/.cache/credential-vault-ci/browser.test
          BUTLER_BROWSER_E2E_SCRIPT: ${{ github.workspace }}/apps/tool-browser/scripts/browser_runtime.mjs
      - name: Preserve required test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-vault-evidence
          path: |
            .cache/credential-vault-ci/*.jsonl
            .cache/credential-vault-ci/owner-*.log
            web/test-results
          include-hidden-files: true
          if-no-files-found: error
