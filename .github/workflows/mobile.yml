name: Android companion
on:
  pull_request:
    paths: ['mobile/**', 'internal/mobile/**', 'internal/memory/catalog/**', 'apps/orchestrator/internal/api/mobile*', 'apps/orchestrator/internal/app/bootstrap*', 'apps/orchestrator/cmd/mobile-lab/**', 'migrations/083_*', 'web/pages/mobile.vue', 'web/tests/e2e/mobile.spec.ts', '.github/workflows/mobile.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'internal/mobile/**', 'migrations/083_*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - run: chmod +x mobile/android/gradlew
      - run: cd mobile/android && GRADLE_USER_HOME="$GITHUB_WORKSPACE/.cache/gradle" ./gradlew --no-configuration-cache testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with: {name: companion-apk-and-reports, path: 'mobile/android/app/build/outputs/'}
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: mobile_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.2', cache: false}
      - run: go mod verify && go test -race ./internal/mobile ./internal/memory/catalog -count=1 && go test ./apps/orchestrator/internal/api -run '^TestMobile' -count=1 && go test ./apps/orchestrator/internal/app -run '^$'
        env: {GOCACHE: '${{ github.workspace }}/.cache/go-build', GOMODCACHE: '${{ github.workspace }}/.cache/go-mod', BUTLER_TEST_MEMORY_POSTGRES_URL: 'postgres://postgres@localhost:5432/mobile_test?sslmode=disable'}
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {api: [31, 33, 35, 36]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools', log-accepted-android-sdk-licenses: false}
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - run: chmod +x mobile/android/gradlew
      - run: echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules && sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: cd mobile/android && GRADLE_USER_HOME="$GITHUB_WORKSPACE/.cache/gradle" ./gradlew --no-configuration-cache connectedDebugAndroidTest
