name: butler-issue82
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: butler
      POSTGRES_DB: memory_jobs_test
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ${ISSUE82_ROOT:?}/postgres:/var/lib/postgresql/data
    networks: [private]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U butler -d memory_jobs_test"]
      interval: 2s
      retries: 30
  verify:
    image: golang:1.27.2-bookworm
    working_dir: /src
    environment:
      GOCACHE: /cache/go-build
      GOTMPDIR: /cache/go-tmp
      GOMODCACHE: /gomod
      BUTLER_TEST_MEMORY_POSTGRES_URL: postgres://butler@postgres:5432/memory_jobs_storage_test?sslmode=disable
      BUTLER_TEST_POSTGRES_URL: postgres://butler@postgres:5432/memory_jobs_storage_test?sslmode=disable
      BUTLER_TEST_ACTIONAUTH_POSTGRES_URL: postgres://butler@postgres:5432/memory_jobs_storage_test?sslmode=disable
      BUTLER_TEST_COMPLETION_POSTGRES_URL: postgres://butler@postgres:5432/memory_jobs_legacy_test?sslmode=disable
      BUTLER_TEST_REDIS_URL: redis://redis:6379/14
      BUTLER_TEST_DOCTOR_BROKER_BINARY: /proof/tool-broker
    volumes:
      - ${ISSUE82_ROOT:?}/current:/src:ro
      - ${ISSUE82_ROOT:?}/.cache:/cache
      - /srv/storage/butler/.cache/go-mod:/gomod:ro
      - ${ISSUE82_ROOT:?}/reports:/proof
    networks: [private]
    mem_limit: 2g
    cpus: 2
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    command: [go, test, -json, -race, -p, '1', -count=1, ./internal/memory/jobs, ./internal/budget]
  redis:
    image: redis:7.4-alpine
    networks: [private]
    mem_limit: 128m
    cpus: 0.5
networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 10.253.82.0/28
