# Apply alongside the baseline and server-browser overlays. No legacy env secret
# import is performed. Supply an operator-owned random key file outside Git.
services:
  orchestrator:
    environment:
      - BUTLER_CREDENTIAL_KEY_FILE=/run/secrets/butler-credential-vault-key
      - BUTLER_PUBLIC_WEB_URL
    secrets:
      - source: credential-vault-key
        target: butler-credential-vault-key
  tool-broker:
    environment:
      - BUTLER_CREDENTIAL_KEY_FILE=/run/secrets/butler-credential-vault-key
    secrets:
      - source: credential-vault-key
        target: butler-credential-vault-key
secrets:
  credential-vault-key:
    file: ${BUTLER_CREDENTIAL_KEY_SOURCE:?Set the operator credential key file path}
