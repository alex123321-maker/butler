# Optional private lab proxy. Credentials/configuration stay outside source snapshots.
services:
  antigravity-proxy:
    image: alpine:3.21
    user: "10001:10001"
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/xray", "run", "-config", "/private/xray.json"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    volumes:
      - ${BUTLER_ANTIGRAVITY_PROXY_BINARY_SOURCE:?set private Xray binary path}:/usr/local/bin/xray:ro
      - ${BUTLER_ANTIGRAVITY_PROXY_CONFIG_SOURCE:?set private Xray config path}:/private/xray.json:ro
    ports:
      - "127.0.0.1:18080:18080"
    networks:
      - backend
  orchestrator:
    environment:
      HTTPS_PROXY: http://antigravity-proxy:18080
      NO_PROXY: localhost,127.0.0.1,postgres,redis,tool-broker
