syntax = "proto3";

package butler.toolbroker.v1;

option go_package = "github.com/butler/butler/internal/gen/toolbroker/v1;toolbrokerv1";

import "toolbroker/v1/types.proto";

service ToolBrokerService {
	// These RPCs use complete actions and trusted run context, never model policy.
	rpc PrepareToolCall(PrepareToolCallRequest) returns (PrepareToolCallResponse);
	rpc AuthorizeToolCall(AuthorizeToolCallRequest) returns (AuthorizeToolCallResponse);
  rpc ValidateToolCall(ValidateToolCallRequest) returns (ValidateToolCallResponse);
  rpc ExecuteToolCall(ExecuteToolCallRequest) returns (ExecuteToolCallResponse);
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc GetToolContract(GetToolContractRequest) returns (GetToolContractResponse);
}

message ValidateToolCallRequest {
  ToolCall tool_call = 1;
}

message ValidateToolCallResponse {
  bool valid = 1;
  ToolError error = 2;
  ToolContract contract = 3;
}

message ExecuteToolCallRequest {
  ToolCall tool_call = 1;
  string authorization_id = 2;
}

message PrepareToolCallRequest {
 ToolCall tool_call = 1;
 // Optional trusted checkpoint identity. Never included in the tool schema.
 string logical_action_ref = 2;
}
message PreparedAction {
 string action_id = 1;
 string action_hash = 2;
 string binding_json = 3;
 bool requires_approval = 4;
 string summary = 5;
 string expires_at = 6;
 string effect_id = 7;
}
message PrepareToolCallResponse { PreparedAction action = 1; ToolError error = 2; }
message AuthorizeToolCallRequest {
 ToolCall tool_call = 1;
 string action_id = 2;
 string approval_id = 3;
 string mandate_id = 4;
}
message AuthorizeToolCallResponse { string authorization_id = 1; ToolError error = 2; }

message ExecuteToolCallResponse {
  ToolResult result = 1;
}

message ListToolsRequest {
  string tool_class = 1;
  bool include_disabled = 2;
  // Private worker context. Missing run_id lists builtin diagnostics only.
  string run_id = 3;
  string query = 4;
  int32 limit = 5;
}

message ListToolsResponse {
  repeated ToolContract tools = 1;
}

message GetToolContractRequest {
  string tool_name = 1;
}

message GetToolContractResponse {
  ToolContract contract = 1;
}
