syntax = "proto3";

package butler.toolbroker.v1;

option go_package = "github.com/butler/butler/internal/gen/toolbroker/v1;toolbrokerv1";

import "common/v1/types.proto";

message CredentialRef {
  string type = 1;
  string alias = 2;
  string field = 3;
}

message ToolError {
  butler.common.v1.ErrorClass error_class = 1;
  string message = 2;
  bool retryable = 3;
  string details_json = 4;
}

message ToolCall {
  string tool_call_id = 1;
  string run_id = 2;
  string tool_name = 3;
  string args_json = 4;
  string status = 5;
  string runtime_target = 6;
  string started_at = 7;
  string finished_at = 8;
  string result_json = 9;
  ToolError error = 10;
  repeated CredentialRef credential_refs = 11;
  butler.common.v1.AutonomyMode autonomy_mode = 12;
}

message ToolResult {
  string tool_call_id = 1;
  string run_id = 2;
  string tool_name = 3;
  string status = 4;
  string result_json = 5;
  ToolError error = 6;
  string finished_at = 7;
  // Broker-owned journal metadata. A runtime response alone is not evidence.
  string action_id = 8;
  string effect_state = 9;
  repeated string evidence_refs = 10;
}

message ToolContract {
  string tool_name = 1;
  string description = 2;
  string tool_class = 3;
  string input_schema_json = 4;
  string output_schema_json = 5;
  string runtime_target = 6;
  string risk_level = 7;
  bool supports_credential_refs = 8;
  bool requires_approval = 9;
  bool supports_streaming = 10;
  string status = 11;
  repeated string allowed_domains = 12;
  repeated string allowed_tools = 13;
  string contract_revision = 14;
  EffectContract effect_contract = 15;
  // Reviewed installed capability metadata, set only by the durable catalog.
  ExtensionContract extension = 16;
  // Fixed pure converter catalog metadata; model args never construct this.
  ConverterContract converter = 17;
}

message ConverterContract {
  string converter_id = 1;
  string package_hash = 2;
  string need_hash = 3;
  string version = 4;
  int64 generation = 5;
  string profile_pin = 6;
  string class = 7;
  string input_schema_hash = 8;
  string output_schema_hash = 9;
  int64 input_bytes = 10;
  int64 output_bytes = 11;
  int64 rows = 12;
  int64 field_bytes = 13;
  int64 millis = 14;
}

message ExtensionResource {
  string origin = 1;
  string path_prefix = 2;
}

message ExtensionCredential {
  string input = 1;
  string field = 2;
  bool required = 3;
}

message ExtensionContract {
  string extension_id = 1;
  string manifest_hash = 2;
  string version = 3;
  string source = 4;
  int64 generation = 5;
  string profile_pin = 6;
  string method = 7;
  string effect = 8;
  repeated ExtensionResource resources = 9;
  repeated ExtensionCredential credentials = 10;
  int64 timeout_ms = 11;
  int64 egress_bytes = 12;
  int64 output_bytes = 13;
  // Optional reviewed recipient guarantee, exact copy of ToolContract policy.
  EffectContract receipt = 14;
}

// Operator-owned capabilities, never model args. Missing values are unsafe.
message EffectContract {
  string retry_safety = 1;
  string idempotency_header = 2;
  string verification_method = 3;
  string scope_origin = 4;
  string verification_url = 5;
}
